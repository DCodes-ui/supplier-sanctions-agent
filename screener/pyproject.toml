[project]
name = "screener"
version = "0.1.0"
description = "Supplier sanctions and risk screening service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
